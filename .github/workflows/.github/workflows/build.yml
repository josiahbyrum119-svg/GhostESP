name: Build GhostESP (Heltec V3 only)

on:
  push:
    branches: [ Development-deki ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.0.1
          target: esp32s3

      - name: Build firmware
        run: idf.py build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ghostesp-heltec-v3
          path: build/ghostesp.bin
