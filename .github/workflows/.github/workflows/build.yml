name: Build GhostESP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.0.1
          target: esp32s3
      - name: Build
        run: idf.py build
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ghostesp-firmware
          path: build/ghostesp.bin
