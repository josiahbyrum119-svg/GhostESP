name: Build GhostESP (Heltec V3 only)

on:
  push:
    branches: [ Development-deki ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF (Heltec V3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.0.1
          target: esp32s3
          path: '.'

      - name: Copy Heltec V3 config
        run: |
          if [ -f configs/sdkconfig.heltecv3 ]; then
            cp configs/sdkconfig.heltecv3 sdkconfig.defaults
          fi

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ghostesp-heltec-v3
          path: build/ghostesp.bin
